<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f3f5fb">
  <meta name="description" content="Meet Khup Muang, a full stack developer and avid reader based in Jenks, Oklahoma.">
  <title>Khup Muang | Full Stack Developer</title>
  <link rel="icon" href="img/logo1.jpeg" type="image/jpeg">
  <style>
    :root {
      color-scheme: light;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-synthesis: none;
      text-rendering: optimizeLegibility;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      --ink: #18233b;
      --muted: #63708a;
      --accent: #6558d9;
      --line: #e7eaf2;
    }

    * {
      box-sizing: border-box;
    }

    body {
      display: grid;
      min-height: 100vh;
      min-height: 100svh;
      place-items: center;
      margin: 0;
      padding: 32px 20px;
      color: var(--ink);
      background:
        radial-gradient(ellipse at 15% 10%, rgba(213, 208, 255, 0.65), transparent 38%),
        radial-gradient(ellipse at 88% 90%, rgba(207, 226, 255, 0.7), transparent 35%),
        #f3f5fb;
    }

    a {
      color: inherit;
    }

    a:focus-visible {
      outline: 3px solid #8b82ff;
      outline-offset: 4px;
    }

    .profile-card {
      width: min(100%, 440px);
      overflow: hidden;
      border: 1px solid rgba(228, 231, 241, 0.9);
      border-radius: 28px;
      background: #fff;
      box-shadow: 0 28px 75px rgba(37, 46, 79, 0.14), 0 4px 12px rgba(37, 46, 79, 0.05);
    }

    .profile-cover {
      position: relative;
      height: 150px;
      overflow: hidden;
      background: linear-gradient(125deg, #252b59 0%, #5147a6 58%, #8e82e8 100%);
    }

    .profile-cover::before,
    .profile-cover::after {
      position: absolute;
      border: 1px solid rgba(255, 255, 255, 0.16);
      border-radius: 50%;
      content: "";
    }

    .profile-cover::before {
      top: -120px;
      right: -34px;
      width: 310px;
      height: 310px;
    }

    .profile-cover::after {
      top: -78px;
      right: 24px;
      width: 220px;
      height: 220px;
    }

    .profile-content {
      padding: 0 36px 30px;
    }

    .identity {
      position: relative;
      z-index: 1;
      margin-top: -54px;
      text-align: center;
    }

    .avatar {
      display: block;
      width: 108px;
      height: 108px;
      margin: 0 auto;
      border: 5px solid #fff;
      border-radius: 50%;
      background: #e8e9f2;
      box-shadow: 0 5px 16px rgba(29, 34, 63, 0.15);
      object-fit: cover;
    }

    .name {
      margin: 17px 0 0;
      font-size: 1.75rem;
      font-weight: 750;
      letter-spacing: -0.045em;
      line-height: 1.2;
    }

    .role {
      margin: 7px 0 0;
      color: var(--accent);
      font-size: 0.94rem;
      font-weight: 700;
      letter-spacing: 0.015em;
    }

    .location {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      margin: 11px 0 0;
      color: var(--muted);
      font-size: 0.88rem;
    }

    .location svg {
      width: 15px;
      height: 15px;
      color: #818ba1;
    }

    .bio {
      max-width: 310px;
      margin: 22px auto 0;
      color: #4f5b73;
      font-size: 0.98rem;
      line-height: 1.7;
    }

    .actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 11px;
      margin-top: 24px;
    }

    .button {
      display: inline-flex;
      min-height: 48px;
      align-items: center;
      justify-content: center;
      gap: 9px;
      padding: 11px 14px;
      border: 1px solid transparent;
      border-radius: 13px;
      font-size: 0.9rem;
      font-weight: 700;
      text-align: center;
      text-decoration: none;
      transition: background-color 160ms ease, border-color 160ms ease, transform 160ms ease;
    }

    .button:hover {
      transform: translateY(-1px);
    }

    .button svg,
    .social-link svg {
      width: 18px;
      height: 18px;
      flex: 0 0 auto;
    }

    .button-primary {
      color: #fff;
      background: #5147b8;
      box-shadow: 0 5px 12px rgba(81, 71, 184, 0.2);
    }

    .button-primary:hover {
      background: #40369f;
    }

    .button-secondary {
      border-color: #dfe3ef;
      color: #313d59;
      background: #fff;
    }

    .button-secondary:hover {
      border-color: #c9c5f5;
      background: #f8f7ff;
    }

    .divider {
      height: 1px;
      margin: 27px 0 19px;
      border: 0;
      background: var(--line);
    }

    .social-heading {
      margin: 0 0 13px;
      color: #7a8498;
      font-size: 0.72rem;
      font-weight: 750;
      letter-spacing: 0.12em;
      text-align: center;
      text-transform: uppercase;
    }

    .social-links {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 10px;
    }

    .social-link {
      display: flex;
      min-height: 45px;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 9px;
      border: 1px solid #e7eaf2;
      border-radius: 12px;
      color: #45516b;
      font-size: 0.84rem;
      font-weight: 650;
      text-decoration: none;
      transition: background-color 160ms ease, border-color 160ms ease, color 160ms ease;
    }

    .social-link:hover {
      border-color: #d4d0f8;
      color: #4339a8;
      background: #f8f7ff;
    }

    .social-link svg {
      width: 17px;
      height: 17px;
    }

    .card-footer {
      padding: 15px 20px;
      border-top: 1px solid #f0f1f6;
      color: #7b8497;
      background: #fcfcfe;
      font-size: 0.78rem;
      text-align: center;
    }

    @media (max-width: 420px) {
      .profile-content {
        padding-right: 22px;
        padding-left: 22px;
      }

      .social-links {
        gap: 7px;
      }

      .social-link {
        gap: 5px;
        padding: 8px 5px;
        font-size: 0.78rem;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        scroll-behavior: auto !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>
<body>
  <main class="profile-card" aria-labelledby="profile-name">
    <div class="profile-cover" aria-hidden="true"></div>
    <div class="profile-content">
      <header class="identity">
        <img class="avatar" src="img/logo1.jpeg" alt="Khup Muang">
        <h1 class="name" id="profile-name">Khup Muang</h1>
        <p class="role">Full Stack Developer</p>
        <p class="location">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
            <path d="M20 10c0 5-8 12-8 12S4 15 4 10a8 8 0 1 1 16 0Z"/>
            <circle cx="12" cy="10" r="2.5"/>
          </svg>
          Jenks, Oklahoma
        </p>
      </header>

      <p class="bio">Full stack developer and avid reader, building for the web and always learning something new.</p>

      <nav class="actions" aria-label="Primary links">
        <a class="button button-primary" href="https://www.kmuang.com" target="_blank" rel="noopener noreferrer">
          View portfolio
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
            <path d="M7 17 17 7M8 7h9v9"/>
          </svg>
        </a>
        <a class="button button-secondary" href="mailto:ksmuang20@gmail.com">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
            <rect x="3" y="5" width="18" height="14" rx="2"/>
            <path d="m4 7 8 6 8-6"/>
          </svg>
          Contact me
        </a>
      </nav>

      <hr class="divider">
      <h2 class="social-heading">Find me online</h2>
      <nav class="social-links" aria-label="Social profiles">
        <a class="social-link" href="https://github.com/kmuang" target="_blank" rel="noopener noreferrer" aria-label="GitHub profile (opens in a new tab)">
          <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
            <path d="M12 .9a11.1 11.1 0 0 0-3.51 21.63c.56.1.76-.24.76-.54v-2.08c-3.1.68-3.76-1.32-3.76-1.32-.5-1.3-1.23-1.65-1.23-1.65-1.01-.69.08-.68.08-.68 1.12.08 1.71 1.15 1.71 1.15.99 1.7 2.59 1.21 3.22.93.1-.72.39-1.21.7-1.49-2.48-.28-5.09-1.24-5.09-5.53 0-1.22.44-2.22 1.15-3-.11-.28-.5-1.42.11-2.96 0 0 .94-.3 3.05 1.15a10.6 10.6 0 0 1 5.55 0c2.12-1.44 3.05-1.15 3.05-1.15.61 1.54.23 2.68.11 2.96.72.78 1.15 1.78 1.15 3 0 4.3-2.62 5.24-5.11 5.52.4.35.76 1.03.76 2.08v3.08c0 .3.2.65.77.54A11.1 11.1 0 0 0 12 .9Z"/>
          </svg>
          GitHub
        </a>
        <a class="social-link" href="https://www.linkedin.com/in/khupmuang/" target="_blank" rel="noopener noreferrer" aria-label="LinkedIn profile (opens in a new tab)">
          <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
            <path d="M20.45 2H3.55C2.69 2 2 2.68 2 3.52v16.96c0 .84.69 1.52 1.55 1.52h16.9c.86 0 1.55-.68 1.55-1.52V3.52c0-.84-.69-1.52-1.55-1.52ZM7.93 18.45H4.97V9h2.96v9.45ZM6.45 7.71a1.71 1.71 0 1 1 0-3.42 1.71 1.71 0 0 1 0 3.42Zm12 10.74h-2.96v-4.6c0-1.1-.02-2.52-1.54-2.52-1.54 0-1.78 1.2-1.78 2.44v4.68H9.21V9h2.84v1.29h.04c.4-.74 1.36-1.53 2.8-1.53 3 0 3.56 1.97 3.56 4.53v5.16Z"/>
          </svg>
          LinkedIn
        </a>
        <a class="social-link" href="https://www.instagram.com/noel_muang/" target="_blank" rel="noopener noreferrer" aria-label="Instagram profile (opens in a new tab)">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
            <rect x="3" y="3" width="18" height="18" rx="5"/>
            <circle cx="12" cy="12" r="4"/>
            <circle cx="17.5" cy="6.8" r=".8" fill="currentColor" stroke="none"/>
          </svg>
          Instagram
        </a>
      </nav>
    </div>
    <footer class="card-footer">Designed and developed by Khup Muang</footer>
  </main>
</body>
</html>
